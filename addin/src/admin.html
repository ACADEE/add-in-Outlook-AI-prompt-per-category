<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 12px; }
    textarea { width: 100%; min-height: 120px; }
    input, button, select { width: 100%; margin: 6px 0; padding: 8px; }
    .row { display:flex; gap:8px; }
    .row > * { flex:1; }
    .small { font-size: 12px; opacity: .85; }
    table { width:100%; border-collapse: collapse; margin-top: 8px; }
    th, td { border: 1px solid #ddd; padding: 6px; font-size: 12px; vertical-align: top; }
    th { text-align: left; }
  </style>
</head>
<body>
  <h3>Administration</h3>

  <div class="small">Backend</div>
  <input id="backendUrl" value="https://localhost:8787" />

  <div class="small">Admin token (Bearer)</div>
  <input id="adminToken" placeholder="colle ADMIN_TOKEN ici" />

  <h4>Clé OpenAI</h4>
  <input id="openaiKey" placeholder="sk-..." />
  <button id="btnSaveKey">Enregistrer la clé</button>

  <h4>Prompts</h4>

  <div class="row">
    <input id="pCategory" placeholder="Catégorie Outlook (ex: Litige, Client VIP, *)" />
    <input id="pName" placeholder="Nom du prompt" />
  </div>
  <div class="row">
    <input id="pPriority" placeholder="Priorité (plus petit = plus prioritaire)" value="100" />
    <select id="pActive">
      <option value="1" selected>Actif</option>
      <option value="0">Inactif</option>
    </select>
  </div>
  <textarea id="pTemplate" placeholder="Template du prompt (instructions)"></textarea>
  <button id="btnCreatePrompt">Créer</button>

  <h4>Liste</h4>
  <button id="btnReload">Recharger</button>
  <div id="status" class="small"></div>
  <div id="table"></div>

  <script src="./admin.js"></script>
</body>
</html>
