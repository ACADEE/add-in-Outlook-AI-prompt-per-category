<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Draft - Composer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      min-width: 400px;
      max-width: 500px;
    }

    h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #333;
    }

    label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 4px;
      margin-top: 8px;
    }

    input, select, textarea, button {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    button {
      background: #0060df;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 500;
      padding: 10px;
    }

    button:hover {
      background: #003eaa;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    .row > * {
      flex: 1;
    }

    .status {
      font-size: 12px;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      display: none;
    }

    .status.error {
      background: #ffe0e0;
      color: #c00;
      display: block;
    }

    .status.success {
      background: #e0ffe0;
      color: #070;
      display: block;
    }

    .status.info {
      background: #e0f0ff;
      color: #006;
      display: block;
    }

    a {
      color: #0060df;
      text-decoration: none;
      font-size: 12px;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h3>🤖 Réponse IA</h3>

  <div id="status" class="status"></div>

  <label>Backend Server</label>
  <input type="text" id="backendUrl" value="https://localhost:8787" />

  <label>Catégories détectées</label>
  <input type="text" id="detectedCategories" readonly placeholder="(en cours de détection...)" />

  <div class="row">
    <div>
      <label>Choix du prompt</label>
      <select id="promptSelect">
        <option value="">Chargement...</option>
      </select>
    </div>
    <div>
      <label>Langue</label>
      <select id="languageSelect">
        <option value="fr" selected>Français</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>

  <button id="btnGenerate">Générer le brouillon</button>

  <label>Brouillon généré</label>
  <textarea id="draft" readonly placeholder="Le brouillon apparaîtra ici..."></textarea>

  <button id="btnInsert">Insérer dans le message</button>

  <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee;">
    <a href="#" id="linkAdmin">⚙️ Ouvrir l'administration</a>
  </div>

  <script src="compose-popup.js"></script>
</body>
</html>
