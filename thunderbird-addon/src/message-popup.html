<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI Draft - Lire le message</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      min-width: 350px;
      max-width: 400px;
    }

    h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #333;
    }

    p {
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #0060df;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      margin-top: 8px;
    }

    button:hover {
      background: #003eaa;
    }

    .info {
      background: #f0f7ff;
      padding: 12px;
      border-radius: 4px;
      border-left: 3px solid #0060df;
      margin-bottom: 12px;
    }

    .info strong {
      display: block;
      margin-bottom: 4px;
      color: #0060df;
    }

    .categories {
      display: inline-block;
      padding: 4px 8px;
      background: #e0f0ff;
      border-radius: 12px;
      font-size: 11px;
      margin-right: 4px;
      margin-bottom: 4px;
    }

    a {
      color: #0060df;
      text-decoration: none;
      font-size: 12px;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h3>🤖 AI Draft</h3>

  <div class="info">
    <strong>Catégories :</strong>
    <div id="categories">(en cours de détection...)</div>
  </div>

  <p>Pour générer une réponse IA, cliquez sur "Répondre" puis utilisez le bouton AI Draft dans la fenêtre de composition.</p>

  <button id="btnReply">Répondre avec IA</button>

  <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee;">
    <a href="#" id="linkAdmin">⚙️ Ouvrir l'administration</a>
  </div>

  <script src="message-popup.js"></script>
</body>
</html>
